[project]
name = "sqlmystery"
version = "0.1.0"
description = "Procedural SQL murder mystery generator and model eval harness"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
harness = ["anthropic>=0.60"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sqlmystery", "harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
